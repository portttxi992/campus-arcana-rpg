<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園奧秘 | Campus Arcana</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- 標題畫面 -->
    <section id="title-screen" class="screen active">
      <div class="title-content">
        <h1 class="game-title" id="main-title">校園奧秘</h1>
        <p class="game-subtitle" id="main-subtitle">Campus Arcana</p>
        <p class="tagline" id="main-tagline">現代校園 · 隱藏的奇幻世界</p>
        <div class="title-buttons">
          <button id="btn-new-game" class="btn primary">開始新遊戲</button>
          <button id="btn-ai-mode" class="btn primary ai-btn">✨ AI 自由模式</button>
          <button id="btn-continue" class="btn secondary" disabled>繼續遊戲</button>
          <button id="btn-select-story" class="btn secondary">選擇章節</button>
          <button id="btn-ai-settings" class="btn secondary">AI 設定</button>
          <button id="btn-clear-save" class="btn secondary danger-btn">清除存檔</button>
        </div>
        <div class="music-control">
          <button id="btn-music" class="btn-icon" title="背景音樂">🎵</button>
          <span id="music-status">音樂：關</span>
        </div>
      </div>
    </section>

    <!-- 角色建立 -->
    <section id="create-screen" class="screen">
      <div class="create-box">
        <h2 id="create-title">建立角色</h2>
        <p class="hint" id="create-hint">你是一名剛轉入「星辰高中」的學生……</p>
        <div class="name-input-group">
          <input type="text" id="player-name" placeholder="輸入名字" maxlength="8" autocomplete="off">
          <button id="btn-random-name" class="btn-icon" title="隨機三字暱稱">🎲</button>
        </div>
        <button id="btn-start" class="btn primary" disabled>進入故事</button>
      </div>
    </section>

    <!-- 遊戲主畫面 -->
    <section id="game-screen" class="screen">
      <header class="game-header">
        <div class="player-info">
          <span id="display-name">—</span>
          <span id="chapter-label" class="chapter-label"></span>
          <button id="btn-save" class="btn-icon small" title="存檔">💾</button>
          <button id="btn-menu" class="btn-icon small" title="選單">☰</button>
        </div>
        <div id="affection-bar" class="affection-bar"></div>
      </header>
      <main class="story-area">
        <div id="story-text" class="story-text"></div>
        <div id="choices" class="choices"></div>
        <div id="ai-loading" class="ai-loading hidden">AI 正在撰寫下一段劇情……</div>
      </main>
      <div id="status-toast" class="toast hidden"></div>
    </section>

    <!-- 選單彈窗 -->
    <div id="menu-modal" class="modal hidden">
      <div class="modal-content">
        <h3>選單</h3>
        <button id="btn-load" class="btn secondary">讀取存檔</button>
        <button id="btn-restart" class="btn secondary">重新開始本章</button>
        <button id="btn-clear-save-menu" class="btn secondary danger-btn">清除所有存檔</button>
        <button id="btn-title" class="btn secondary">返回標題</button>
        <button id="btn-close-menu" class="btn primary">關閉</button>
      </div>
    </div>

    <!-- 章節選擇 -->
    <div id="story-modal" class="modal hidden">
      <div class="modal-content wide">
        <h3>選擇章節</h3>
        <p class="modal-hint">必須從第一章開始。完成前一章後解鎖下一章。</p>
        <div id="story-list"></div>
        <button id="btn-close-story" class="btn primary">關閉</button>
      </div>
    </div>

    <!-- AI 設定彈窗 -->
    <div id="ai-settings-modal" class="modal hidden">
      <div class="modal-content wide">
        <h3>AI 設定</h3>
        <p class="modal-hint">API Key 只存在你的瀏覽器，不會上傳到本站伺服器。</p>
        <label class="form-label">服務商</label>
        <select id="ai-provider" class="form-select">
          <option value="openai">OpenAI（GPT）</option>
          <option value="gemini">Google Gemini</option>
          <option value="openrouter">OpenRouter（通用）</option>
          <option value="compatible">自訂 OpenAI 相容端點</option>
        </select>
        <label class="form-label">API Key</label>
        <input type="password" id="ai-api-key" class="form-input" placeholder="貼上你的 API Key" autocomplete="off">
        <label class="form-label">模型（可選）</label>
        <input type="text" id="ai-model" class="form-input" placeholder="例如 gpt-4o-mini / gemini-2.0-flash">
        <div id="custom-endpoint-wrap" class="hidden">
          <label class="form-label">API 端點 URL</label>
          <input type="text" id="ai-endpoint" class="form-input" placeholder="https://api.example.com/v1/chat/completions">
        </div>
        <p class="modal-hint" id="ai-hint">OpenAI：platform.openai.com　Gemini：aistudio.google.com　OpenRouter：openrouter.ai</p>
        <button id="btn-save-ai-settings" class="btn primary">儲存設定</button>
        <button id="btn-close-ai-settings" class="btn secondary">關閉</button>
      </div>
    </div>
  </div>

  <script src="js/stories.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
